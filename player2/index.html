<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambilight VR — второй подход без генерации</title>
<!-- HLS.js: обычный <video> в Chrome/Firefox не проигрывает .m3u8 напрямую,
     нужна прослойка через MediaSource (Safari — единственный, кто умеет
     нативно, ему эта библиотека не понадобится и подключаться не будет). -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#08080a;color:#e6e6ea;overflow:hidden;
    font:13px/1.55 -apple-system,system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #panel{position:fixed;left:14px;top:14px;background:#000000bb;padding:12px 14px;
    border-radius:10px;backdrop-filter:blur(8px);max-width:300px}
  h1{font-size:13px;margin:0 0 8px;font-weight:600}
  button{font:inherit;padding:7px 11px;border-radius:7px;border:1px solid #3a3a44;
    background:#1b1b21;color:#e6e6ea;cursor:pointer}
  button.on{background:#2c4d86;border-color:#4c76bb}
  .row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
  .row label{color:#94949e;width:88px}
  input[type=range]{flex:1;min-width:80px}
  b{font-variant-numeric:tabular-nums}
  #modes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  #modes button{flex:1;min-width:70px;font-size:12px;padding:8px 6px}
  #log{margin-top:8px;color:#94949e;white-space:pre-line;max-height:110px;overflow:auto;font-size:11px}
  #hud{position:fixed;right:14px;top:14px;background:#000000bb;padding:7px 10px;
    border-radius:8px;color:#b8b8c2;font-size:12px}
  input[type=file]{max-width:100%;color:#94949e;font-size:12px}
  input[type=text]{flex:1;min-width:120px;background:#1b1b21;color:#e6e6ea;
    border:1px solid #3a3a44;border-radius:7px;padding:6px 8px;font:inherit}
  #vrPanel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#101015;border-radius:20px;padding:26px 30px;min-width:300px;
    text-align:center;font:16px -apple-system,system-ui,sans-serif;color:#e8e8ee}
  #vrPanel.show{display:block}
  #vrPanel .row{display:flex;gap:10px;justify-content:center;margin:10px 0}
  #vrPanel button{font:600 17px inherit;padding:13px 18px;border-radius:12px;
    border:1px solid #3a3a44;background:#1b1b21;color:#e6e6ea;min-width:120px}
  #vrPanel .hint{color:#6f6f7c;font-size:12px;margin-top:4px}
</style>

<canvas id="c"></canvas>

<div id="panel">
  <h1>Ambilight VR — без генерации панорам</h1>
  <div class="row"><input type="file" id="file" accept="video/*"></div>
  <div class="row"><input id="url" type="text" placeholder="ссылка на видео (mp4/webm)">
    <button id="urlGo">Загрузить</button></div>
  <div class="row">
    <button id="play" disabled>▶︎ Смотреть</button>
    <button id="xr" disabled>Войти в VR</button>
  </div>
  <div id="modes">
    <button data-m="0" class="on">Ambilight</button>
    <button data-m="1">Крылья</button>
    <button data-m="2">Блюр</button>
    <button data-m="3">Гибрид</button>
    <button data-m="4">Гибрид2</button>
  </div>
  <div class="row"><label>сила</label>
    <input id="strength" type="range" min="0" max="150" value="100"><b id="strengthv">1.00</b></div>
  <div class="row"><label>размер экрана</label>
    <input id="scr" type="range" min="30" max="110" value="55"><b id="scrv">55°</b></div>
  <div id="log"></div>
</div>
<div id="hud">—</div>

<div id="vrPanel">
  <div class="row">
    <button id="vrPlay">❚❚ Пауза</button>
    <button id="vrExit">Выйти из VR</button>
  </div>
  <div class="hint">триггер — пауза/показ · захват — выход из VR</div>
</div>

<script type="module">
const qs = new URLSearchParams(location.search);
const log = (...a) => { const el = document.getElementById('log');
  el.textContent += a.join(' ') + '\n'; el.scrollTop = 1e6; console.log(...a); };

// ---------------------------------------------------------------- WebGL
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {xrCompatible:true, antialias:true, alpha:false});
if (!gl) log('WebGL2 недоступен');

function prog(vs, fs){
  const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s);
    gl.compileShader(o);
    if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) log(gl.getShaderInfoLog(o));
    return o; };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) log(gl.getProgramInfoLog(p));
  return p;
}

const VS = `#version 300 es
layout(location = 0) in vec3 pos;
layout(location = 1) in vec2 uv;
out vec2 vuv;
out vec3 vpos;
uniform mat4 mvp;
void main(){ vuv = uv; vpos = pos; gl_Position = mvp * vec4(pos, 1.0); }`;

// Фон: никакой заранее сгенерированной панорамы — всё сэмплится из ТЕКУЩЕГО
// кадра видео (texV) прямо здесь, каждый кадр, в зависимости от режима.
//   0 ambilight — цвет сектора (из uSector[16], посчитан в JS по кромке кадра)
//   1 mirror    — зеркальное продолжение самого кадра по бокам/сверху/снизу
//   2 blur      — растянутый и размытый (через мип-уровни) кадр
//   3 hybrid    — у экрана зеркало, дальше — цвет ambilight
const FS_BG = `#version 300 es
precision highp float;
in vec2 vuv; in vec3 vpos; out vec4 frag;
uniform sampler2D texV;
uniform vec3 uSector[16];
uniform int uMode;
uniform float uStrength, uScreenHalfU, uScreenHalfV, uAspect;
uniform float uLumaGain, uFlash; uniform vec3 uFlashColor;

// mod-периодика повторяла кадр снова и снова по мере роста su — в шлеме,
// где виден весь купол вокруг (а не только узкий сектор перед мышью),
// это читалось как калейдоскоп. Теперь — ровно ОДНО отражение.
// Экран занимает su от -1 до 1 (ширина 2 su-единицы = вся ширина кадра).
// Чтобы зеркало показало ВЕСЬ кадр целиком, а не половину, ему тоже нужно
// 2 su-единицы: su=1 (край экрана, f=1) → su=3 (f=-1, другой край кадра).
// Раньше диапазон обрывался на su=2 (f=0, только середина кадра) — отсюда
// была обрезка ровно пополам. Дальше su=3 — держим последний край.
float mirrorOnce(float x){
  float ax = clamp(abs(x), 0.0, 3.0);
  float f = ax <= 1.0 ? ax : 2.0 - ax;
  return x < 0.0 ? -f : f;
}

// Для верха/низа — та же одна отражённая копия (su 1→3), плюс ещё пол-кадра
// сверху: после su=3 (дальний край кадра, f=-1) продолжаем зеркалить дальше
// ещё на 1 su-единицу (= половина ширины кадра), идя обратно к центру.
float mirrorExtend(float x){
  float ax = clamp(abs(x), 0.0, 4.0);
  float f;
  if (ax <= 1.0) f = ax;
  else if (ax <= 3.0) f = 2.0 - ax;
  else f = ax - 4.0;
  return x < 0.0 ? -f : f;
}

// Для «Блюр»: тут единица уже = половина кадра (окно -1..1 само по себе
// показывает кадр целиком через знак), так что продлить на «ещё пол-кадра»
// значит зеркалить ровно один дополнительный интервал после края.
float mirrorHalfMore(float x){
  float ax = clamp(abs(x), 0.0, 2.0);
  float f = ax <= 1.0 ? ax : 2.0 - ax;
  return x < 0.0 ? -f : f;
}

// Зона впритык к каждому краю экрана — отдельный прямоугольник, не диагональ:
// справа/слева (|su.y|<=1, экран по вертикали) кадр ставится в тык и
// отражается ТОЛЬКО по горизонтали; сверху/снизу (|su.x|<=1) — только по
// вертикали. Так каждая сторона — чистая цельная зеркальная копия кадра,
// без искажений от диагонального деления и без двойных углов-повторов.
vec2 wingUV(vec2 su){
  bool inVBand = abs(su.y) <= 1.0;   // в пределах высоты экрана — зона слева/справа
  bool inHBand = abs(su.x) <= 1.0;   // в пределах ширины экрана — зона сверху/снизу
  // v экрана инвертирована относительно su.y (в screenQuad верх кадра — v=0,
  // низ — v=1), поэтому вертикаль всюду со знаком минус, иначе верх/низ
  // подставлялись бы не тем краем и выглядели перевёрнуто/неправильно.
  if (inVBand && !inHBand)
    return vec2(0.5 + 0.5 * mirrorExtend(su.x), 0.5 - 0.5 * su.y);
  if (inHBand && !inVBand)
    return vec2(0.5 + 0.5 * su.x, 0.5 - 0.5 * mirrorExtend(su.y));
  // угол (вышли за край сразу по обеим осям) — здесь больше не зеркалим ни
  // по одной оси (получалась вытянутая косая полоса), а держим ближайший к
  // экрану пиксель; яркость в углу отдельно быстро гасится в main().
  return vec2(0.5 + 0.5 * clamp(su.x, -1.0, 1.0), 0.5 - 0.5 * clamp(su.y, -1.0, 1.0));
}

vec3 sampleMirror(vec2 su){ return texture(texV, wingUV(su)).rgb; }
vec3 sampleBlur(vec2 su, float lod){ return textureLod(texV, wingUV(su), lod).rgb; }

// Угол: раньше подмешивали ровный ambient-цвет — просили вместо этого
// реальные кадры видео. Зеркалим сразу по обеим осям (только здесь, в узком
// угловом клине, а не по всему куполу — поэтому сеткой-калейдоскопом это
// уже не читается), сильно блюрим.
// mirrorExtend (не mirrorOnce) по ОБЕИМ осям — угол теперь обрезается на
// dist=4, вровень с крылом сверху/снизу; mirrorOnce своим плато на 3 держал
// статичную картинку весь зазор 3..4, читалось как «растягивание».
vec3 sampleCorner(vec2 su, float lod){
  vec2 uv = vec2(0.5 + 0.5 * mirrorExtend(su.x), 0.5 - 0.5 * mirrorExtend(su.y));
  return textureLod(texV, uv, lod).rgb;
}

vec3 sectorColor(float angle){
  // angle: -PI..PI. Линейная интерполяция только между двумя ближайшими из
  // 16 секторов давала слишком резкий переход — на экране это читалось как
  // чёткие «лучи», расходящиеся от зрителя (граница сектора = луч, потому
  // что вдоль одного направления от глаза цвет фона не меняется с расстоянием).
  // Вместо этого — мягкое круговое взвешивание косинусом по ВСЕМ секторам:
  // каждый вносит вклад пропорционально cos(разница_угла)^6 — лепесток уже,
  // чем ±90° (был слишком размыт), но всё ещё непрерывный, без резкого края
  // на границе сектора. 16 итераций без текстур — почти бесплатно.
  vec3 sum = vec3(0.0);
  float wsum = 0.0;
  for (int i = 0; i < 16; i++){
    float sectorAngle = (float(i) / 16.0) * 6.2831853 - 3.14159265;
    float d = angle - sectorAngle;
    d = mod(d + 3.14159265, 6.2831853) - 3.14159265;
    float w = max(0.0, cos(d));
    w = w * w * w * w * w * w; // ^6 — заметно уже прошлого широкого лепестка
    sum += uSector[i] * w;
    wsum += w;
  }
  return sum / max(wsum, 0.0001);
}

void main(){
  // su.x/su.y раньше считались из сырых мировых координат (vpos.x/halfU).
  // На сферическом куполе vpos.x = R*sin(yaw) — а синус НЕ монотонен при
  // обходе на 360°: он несколько раз проходит одни и те же значения по
  // кругу, так что купол несколько раз «попадал» в зону отражения за один
  // оборот — отсюда и полосы, сколько ни клэмпай саму функцию отражения.
  // Считаем расстояние от экрана по углу (yaw/pitch) — он монотонен и не
  // повторяется, единственное «отражение» получается ровно один раз.
  float yaw = atan(vpos.x, -vpos.z);
  float pitch = asin(clamp(vpos.y / max(length(vpos), 0.0001), -1.0, 1.0));
  float halfYaw = atan(uScreenHalfU / 6.0);     // 6.0 = SCREEN_D в JS
  float halfPitch = atan(uScreenHalfV / 6.0);
  float su_x = yaw / halfYaw;
  float su_y = pitch / halfPitch;
  float dist = max(abs(su_x), abs(su_y));   // 0 у центра, 1 у рамки экрана

  // Экран больше НЕ отделяем зазором — фон продолжает кадр бесшовно.
  // Угол (вышел за край сразу по обеим осям) — заполняем реальным кадром
  // (двойное зеркало, сильно блюрится), а не ровным ambient-цветом.
  // Раньше угол был смесью «зажатого» края (из wingUV) и cornerFill в
  // пропорции cornerBlend — на стыке эти два по-разному засэмплированных
  // цвета не совпадали, и смесь на границе «мигала»/выглядела как будто
  // угол полупрозрачный. Теперь в угловой зоне используем ТОЛЬКО cornerFill,
  // без подмеса — жёсткое, но чистое переключение.
  // JS считает сектор по углу вокруг кромки кадра сразу по двум осям
  // (atan2(cx,-cy)) — а тут в шейдере раньше передавался только yaw, без
  // pitch. Из-за этого цвет зависел только от горизонтального направления:
  // точка прямо над экраном получала тот же цвет, что и точка на той же
  // высоте зрителя — сплошная вертикальная полоса от пола до потолка вместо
  // кругового градиента. su_x/su_y уже нормализованы под аспект экрана,
  // так что их соотношение и даёт тот же «компас», что и в JS.
  vec3 amb = sectorColor(atan(su_x, su_y));
  bool isCorner = abs(su_x) > 1.0 && abs(su_y) > 1.0;
  vec3 cornerFill = isCorner ? sampleCorner(vec2(su_x, su_y), 4.5) : vec3(0.0);
  // Плавный, широкий уход в прозрачность у границы крыла (не обрез, не узкая
  // полоска). Теперь все стороны (слева/справа/сверху/снизу/угол) продлены
  // mirrorExtend одинаково, до dist=4 — раньше бока обрывались на dist=3,
  // и между ними и уже продлёнными верх/низ/углом образовывался чёрный
  // клин ровно посередине сбоку.
  float wingCutoff = 4.0;
  // Ширина зоны затухания — половина всей длины крыла (от края экрана dist=1
  // до wingCutoff), то есть заметно шире, чем было.
  float fadeWidth = (wingCutoff - 1.0) * 0.5;
  float fadeOut = 1.0 - smoothstep(wingCutoff - fadeWidth, wingCutoff, dist);

  vec3 c;
  if (uMode == 0){
    // Купол ambilight — не все 360°, а окно 180° (±90°) по горизонтали и
    // покороче по вертикали (±50°), с плавным уходом в прозрачность у всех
    // краёв (как в «Блюр»), а не сплошной цвет позади/над/под зрителем.
    float ambHalfSpan = radians(90.0);
    float ambPitchHalfSpan = radians(50.0);
    float ta  = yaw / ambHalfSpan;
    float tav = pitch / ambPitchHalfSpan;
    float ambFade = (1.0 - smoothstep(0.6, 1.0, abs(ta)))
                   * (1.0 - smoothstep(0.6, 1.0, abs(tav)));
    c = amb * ambFade;
  } else if (uMode == 1){
    // Заметно сильнее блюр, чем раньше, и не так сильно растёт от dist —
    // одинаково мягко у края и дальше, без ощущения нарастающей резкости.
    float lod = clamp(3.5 + dist * 0.6, 0.0, 7.0);
    vec3 wing = isCorner ? cornerFill : sampleBlur(vec2(su_x, su_y), lod);
    c = wing * fadeOut;
  } else if (uMode == 2){
    // Растягиваем кадр на 180° (±90°) по горизонтали; вертикальный угол
    // берём пропорционально реальному соотношению сторон кадра (uAspect =
    // ширина/высота), чтобы не расплющивать картинку. По вертикали —
    // продлеваем зеркально ещё на пол-кадра сверху и снизу. У обеих границ —
    // плавный уход в прозрачность, а не обрез.
    float halfYawSpan = radians(90.0);
    float halfPitchSpan = halfYawSpan / uAspect;
    float t  = yaw / halfYawSpan;             // -1..1 по горизонтали окна
    float tv = pitch / halfPitchSpan;         // -1..1 по вертикали окна
    float mu = clamp(0.5 + 0.5 * t, 0.0, 1.0);
    float mv = 0.5 - 0.5 * mirrorHalfMore(tv);
    vec3 stretched = textureLod(texV, vec2(mu, mv), 2.5).rgb;
    float edgeFade = (1.0 - smoothstep(0.4, 1.0, abs(t)))
                    * (1.0 - smoothstep(0.8, 2.0, abs(tv)));
    c = stretched * edgeFade;
  } else if (uMode == 3){
    vec3 mir = isCorner ? cornerFill
      : sampleBlur(vec2(su_x, su_y), clamp(3.0 + dist * 1.0, 0.0, 7.0));
    // до dist=2.0, пока mirrorOnce ещё не «держит» плато — дальше только amb
    float k = smoothstep(1.0, 2.0, dist);      // у экрана зеркало, дальше — ambilight
    c = mix(mir, amb, k);
  } else {
    // Гибрид2: не отражение, а один и тот же кадр по центру, увеличенный
    // в 2 раза (масштаб su/2 — картинка растягивается на вдвое большую
    // угловую область) и размытый; у краёв — ambilight, как в «Гибриде».
    float mu = clamp(0.5 + 0.25 * su_x, 0.0, 1.0);
    float mv = clamp(0.5 - 0.25 * su_y, 0.0, 1.0);
    float lod = clamp(2.0 + dist * 1.0, 0.0, 7.0);
    vec3 zoomed = textureLod(texV, vec2(mu, mv), lod).rgb;
    float k = smoothstep(1.5, 2.5, dist);      // ближе — увеличенный кадр, дальше — ambilight
    c = mix(zoomed, amb, k);
  }

  c *= uStrength * uLumaGain;
  c += uFlashColor * uFlash * 1.4;
  // мягкое гашение самого дальнего пояса (сзади наблюдателя)
  float back = smoothstep(6.0, 9.0, dist);
  c *= 1.0 - back;
  // Плавные ambient-градиенты на 8-битном буфере квантуются в заметные
  // «ступеньки» — добавляем крошечный псевдослучайный шум (±1/255) перед
  // записью, он разбивает границы шага и глазом не читается как шум.
  float dNoise = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  c += (dNoise - 0.5) / 255.0;
  frag = vec4(c, 1.0);
}`;

const FS_SCR = `#version 300 es
precision highp float;
in vec2 vuv; out vec4 frag;
uniform sampler2D tex;
void main(){ frag = vec4(texture(tex, vuv).rgb, 1.0); }`;

const pBG = prog(VS, FS_BG), pSCR = prog(VS, FS_SCR);
const locBG = {};
for (const n of ['mvp','texV','uSector','uMode','uStrength','uScreenHalfU',
                 'uScreenHalfV','uAspect','uLumaGain','uFlash','uFlashColor'])
  locBG[n] = gl.getUniformLocation(pBG, n);
const locSCR = {};
for (const n of ['mvp','tex']) locSCR[n] = gl.getUniformLocation(pSCR, n);
{
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  log(`GL: ${gl.getParameter(gl.VERSION)}`);
  if (dbg) log(`видеочип: ${gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}`);
}

function mesh(pos, uv, idx){
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const put = (data, loc, n) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
  };
  put(pos, 0, 3); put(uv, 1, 2);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao, count: idx.length};
}

// Купол из полос вокруг зрителя. Ничего не «сгенерировано» — это просто
// геометрия-экран для шейдера выше, все цвета считаются в реальном времени.
function dome(R, cols = 64, rows = 24){
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= rows; j++){
    const v = j/rows, pitch = (v*2 - 1) * 1.3;         // немного за горизонт
    for (let i = 0; i <= cols; i++){
      const u = i/cols, yaw = (u*2 - 1) * Math.PI;
      const cx = Math.cos(pitch);
      pos.push(R*cx*Math.sin(yaw), R*Math.sin(pitch)*1.15, -R*cx*Math.cos(yaw));
      uv.push(u, v);
    }
  }
  for (let j = 0; j < rows; j++)
    for (let i = 0; i < cols; i++){
      const k = j*(cols+1) + i;
      idx.push(k, k+1, k+cols+1, k+1, k+cols+2, k+cols+1);
    }
  return mesh(pos, uv, idx);
}

function screenQuad(D, aspect, fovRad){
  const w = 2*D*Math.tan(fovRad/2), h = w/aspect;
  return {mesh: mesh([-w/2,-h/2,-D, w/2,-h/2,-D, -w/2,h/2,-D, w/2,h/2,-D],
                     [0,1, 1,1, 0,0, 1,0], [0,1,2, 1,3,2]),
          halfU: w/2, halfV: h/2};
}

const BG = dome(14);
let screenFov = 55, videoAspect = 16/9;
const SCREEN_D = 6;
let SCR = screenQuad(SCREEN_D, videoAspect, screenFov*Math.PI/180);
const rebuildScreen = () => { SCR = screenQuad(SCREEN_D, videoAspect, screenFov*Math.PI/180); };

function tex(){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE,
                new Uint8Array([8,8,10]));
  return t;
}
// Отдельная текстура видео с мипмапами: режим «блюр» получает размытие почти
// бесплатно через textureLod, без единого лишнего прохода рендера.
const texV = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texV);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE,
              new Uint8Array([8,8,10]));

// ---------------------------------------------------------------- матрицы
const mul = (a, b) => { const o = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++){ let s=0;
    for (let k=0;k<4;k++) s += a[k*4+j]*b[i*4+k]; o[i*4+j]=s; }
  return o; };
function perspective(fovY, asp, n, f){
  const t = 1/Math.tan(fovY/2);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]);
}
function lookRot(yaw, pitch){
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  return new Float32Array([cy,sy*sp,-sy*cp,0, 0,cp,sp,0, sy,-cy*sp,cy*cp,0, 0,0,0,1]);
}

// ---------------------------------------------------------------- видео
const video = document.createElement('video');
video.crossOrigin = 'anonymous'; video.playsInline = true; video.preload = 'auto';
video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
video.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;' +
                      'opacity:0.01;pointer-events:none;z-index:-1';
document.body.appendChild(video);
let haveVideo = false, tainted = false, texUploads = 0;
let videoDirty = true, texAllocated = false, vfcSupported = false;
let texW = 0, texH = 0;

function watchFrames(){
  if (!video.requestVideoFrameCallback) return;
  vfcSupported = true;
  const step = () => { videoDirty = true; video.requestVideoFrameCallback(step); };
  video.requestVideoFrameCallback(step);
}
// rVFC не срабатывает на паузе — без этого перемотка на паузе оставляла
// текстуру на старом (или самом первом placeholder-) кадре.
video.addEventListener('seeked', () => { videoDirty = true; });
// У HLS.js (MediaSource) requestVideoFrameCallback иногда объявлен, но
// реально не стреляет — экран оставался чёрным навсегда, хотя амбилайт
// (отдельная выборка через drawImage на interval, без привязки к rVFC)
// работал нормально. Подстраховка: обновляем текстуру минимум раз в ~60мс
// в любом случае, даже если rVFC молчит.
setInterval(() => { videoDirty = true; }, 60);

let hls = null;
function attachVideo(src, name){
  video.onloadedmetadata = () => {
    haveVideo = true;
    videoAspect = video.videoWidth / video.videoHeight;
    rebuildScreen();
    document.getElementById('play').disabled = false;
    texAllocated = false;
    texW = 0; texH = 0;
    watchFrames();
    log(`фильм: ${name}  ${video.videoWidth}×${video.videoHeight}  ` +
        `(${videoAspect.toFixed(2)}:1)`);
  };

  if (hls) { hls.destroy(); hls = null; }

  const isM3u8 = /\.m3u8(\?|$)/i.test(src.split('#')[0]);
  // canPlayType('application/vnd.apple.mpegurl') в некоторых сборках Chrome
  // возвращает "maybe" (не пустую строку — то есть правдоподобно "да"),
  // хотя реально HLS не тянет; полагаться на этот флаг нельзя. Раз HLS.js
  // поддерживается (Hls.isSupported() проверяет наличие MediaSource) —
  // всегда используем его, это надёжнее заявленной браузером «поддержки».

  if (isM3u8 && window.Hls && Hls.isSupported()) {
    // Явно без credentials (куки/авторизация) на запросах сегментов — иначе
    // при определённых ответах сервера итоговое видео может считаться
    // «замаранным» (tainted) для чтения в canvas/WebGL: сама картинка и звук
    // играют нормально, а вот выгрузка кадра в текстуру начинает тихо
    // падать на каждом кадре — экран замирает на последнем кадре, звук идёт
    // дальше. video.crossOrigin='anonymous' уже стоит, но у HLS.js свои
    // отдельные XHR/fetch для сегментов, им нужно то же самое явно.
    hls = new Hls({
      xhrSetup: (xhr) => { xhr.withCredentials = false; },
      fetchSetup: (context, initParams) => {
        initParams.credentials = 'omit';
        return new Request(context.url, initParams);
      }
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) log(`HLS ошибка: ${data.type} — ${data.details}`);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    video.src = src;
  }
}
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  attachVideo(URL.createObjectURL(f), f.name);
};
const urlInput = document.getElementById('url');
const loadFromUrl = () => {
  const u = urlInput.value.trim();
  if (!u) return;
  attachVideo(u, u);
};
document.getElementById('urlGo').onclick = loadFromUrl;
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadFromUrl(); });
if (qs.get('video')) attachVideo(qs.get('video'), qs.get('video'));

const playBtn = document.getElementById('play');
async function startPlay(){
  try { await video.play(); playBtn.textContent = '❚❚ Пауза'; }
  catch (e) {
    if (e.name === 'NotAllowedError' && !video.muted){
      video.muted = true;
      log('автозапуск со звуком запрещён — включил без звука');
      return startPlay();
    }
    playBtn.textContent = '▶︎ Смотреть';
    log('не удалось запустить: ' + e.name);
  }
}
playBtn.onclick = () => {
  if (video.paused) startPlay();
  else if (video.muted) { video.muted = false; }
  else { video.pause(); playBtn.textContent = '▶︎ Смотреть'; }
};

// ---------------------------------------------------------------- режимы
let mode = 0, strength = 1.0;
for (const b of document.querySelectorAll('#modes button')){
  b.onclick = () => {
    mode = +b.dataset.m;
    document.querySelectorAll('#modes button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  };
}
const bind = (id, out, f, fmt) => { const el = document.getElementById(id);
  el.oninput = () => { f(+el.value); document.getElementById(out).textContent = fmt(+el.value); }; };
bind('strength','strengthv', v => strength = v/100, v => (v/100).toFixed(2));
bind('scr','scrv', v => { screenFov = v; rebuildScreen(); }, v => v.toFixed(0)+'°');

// ---------------------------------------------------------------- анализ кадра
// Тот же приём, что дал хороший результат в первом плеере: следим за
// яркостью и цветом кадра НА ХОДУ, без всякого предсказания затемнений —
// плюс здесь же считаем 16 секторов по кромке для режима ambilight.
const probe = Object.assign(document.createElement('canvas'), {width:32, height:32});
const pctx = probe.getContext('2d', {willReadFrequently:true});
const sectorRGB = new Float32Array(48);      // 16 секторов x rgb
let lumaNow = 1, lumaRef = 0.001, lumaGain = 1;
let avgRGB = [1,1,1], flashNow = 0;

function sampleFrame(){
  if (!haveVideo || video.readyState < 2) return;
  pctx.drawImage(video, 0, 0, 32, 32);
  const d = pctx.getImageData(0, 0, 32, 32).data;
  let lum=0, ln=0, rAll=0,gAll=0,bAll=0;
  // 16 секторов по периметру кадра, по часовой от верха — совпадает
  // с sectorColor() в шейдере. Рамка кромки расширена до 3px (было 2px):
  // секторов вдвое больше, каждому нужно больше пикселей на усреднение.
  const acc = new Array(16).fill(0).map(() => [0,0,0,0]);
  for (let y=0;y<32;y++) for (let x=0;x<32;x++){
    const i=(y*32+x)*4;
    lum += 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]; ln++;
    rAll+=d[i]; gAll+=d[i+1]; bAll+=d[i+2];
    const onEdge = x<3 || x>28 || y<3 || y>28;
    if (!onEdge) continue;
    const cx = x-15.5, cy = y-15.5;
    let angle = Math.atan2(cx, -cy);              // 0 = верх, по часовой
    let sector = Math.round((angle/Math.PI*0.5+0.5)*16) % 16;
    if (sector < 0) sector += 16;
    const a = acc[sector]; a[0]+=d[i]; a[1]+=d[i+1]; a[2]+=d[i+2]; a[3]++;
  }
  // Каждый сектор — это ограниченное число пикселей кромки, очень шумная
  // выборка: сырые значения дёргались/мигали от кадра к кадру. Сглаживаем
  // экспоненциально вместо прямой подстановки — то же место, где раньше
  // был фликер.
  for (let s=0;s<16;s++){
    const a = acc[s], n = Math.max(1, a[3]);
    const r = a[0]/n/255, g = a[1]/n/255, b = a[2]/n/255;
    sectorRGB[s*3]   += (r - sectorRGB[s*3])   * 0.25;
    sectorRGB[s*3+1] += (g - sectorRGB[s*3+1]) * 0.25;
    sectorRGB[s*3+2] += (b - sectorRGB[s*3+2]) * 0.25;
  }
  lumaNow = lum/ln/255;
  avgRGB = [rAll/ln/255, gAll/ln/255, bAll/ln/255];
  lumaRef = lumaNow > lumaRef ? lumaRef*0.7 + lumaNow*0.3 : lumaRef*0.995 + lumaNow*0.005;
}
setInterval(sampleFrame, 90);

// ---------------------------------------------------------------- ввод
let yaw = 0, pitch = 0, camFov = 85, drag = null;
cv.addEventListener('mousedown', e => drag = [e.clientX, e.clientY]);
addEventListener('mouseup', () => drag = null);
addEventListener('mousemove', e => {
  if (!drag) return;
  yaw   = Math.max(-Math.PI, Math.min(Math.PI, yaw - (e.clientX-drag[0])*0.0022));
  pitch = Math.max(-0.9, Math.min(0.9, pitch + (e.clientY-drag[1])*0.0022));
  drag = [e.clientX, e.clientY];
});

// ---------------------------------------------------------------- отрисовка
function drawEye(proj, view){
  const mvp = mul(proj, view);
  gl.useProgram(pBG);
  gl.uniformMatrix4fv(locBG.mvp, false, mvp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texV);
  gl.uniform1i(locBG.texV, 0);
  gl.uniform3fv(locBG.uSector, sectorRGB);
  gl.uniform1i(locBG.uMode, mode);
  gl.uniform1f(locBG.uStrength, strength);
  gl.uniform1f(locBG.uScreenHalfU, SCR.halfU);
  gl.uniform1f(locBG.uScreenHalfV, SCR.halfV);
  gl.uniform1f(locBG.uAspect, videoAspect);
  gl.uniform1f(locBG.uLumaGain, lumaGain);
  gl.uniform1f(locBG.uFlash, flashNow);
  gl.uniform3f(locBG.uFlashColor, avgRGB[0], avgRGB[1], avgRGB[2]);
  gl.bindVertexArray(BG.vao);
  gl.drawElements(gl.TRIANGLES, BG.count, gl.UNSIGNED_SHORT, 0);

  if (haveVideo){
    gl.useProgram(pSCR);
    gl.uniformMatrix4fv(locSCR.mvp, false, mvp);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texV);
    gl.uniform1i(locSCR.tex, 0);
    gl.bindVertexArray(SCR.mesh.vao);
    gl.drawElements(gl.TRIANGLES, SCR.mesh.count, gl.UNSIGNED_SHORT, 0);
  }
}

let last = 0, fps = 0, fpsT = 0, fpsN = 0;
function frame(now, xrFrame){
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now;
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5){ fps = Math.round(fpsN/fpsT); fpsN = 0; fpsT = 0; }

  const target = Math.pow(Math.min(1, lumaNow / Math.max(0.004, lumaRef)), 0.8);
  lumaGain += (target - lumaGain) * Math.min(1, dt / 0.18);
  const ratio = lumaNow / Math.max(0.004, lumaRef);
  const want = Math.min(1, Math.max(0, (ratio - 1.5) / 1.8));
  flashNow = want > flashNow ? want : flashNow + (want - flashNow) * Math.min(1, dt / 0.25);

  if (haveVideo && video.readyState >= 2 && (videoDirty || !vfcSupported)){
    videoDirty = false;
    gl.bindTexture(gl.TEXTURE_2D, texV);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    try {
      // HLS-плеер на ходу переключает качество (например, 600p → FullHD),
      // и разрешение video.videoWidth/Height меняется прямо посреди
      // просмотра. Текстура была выделена под старый размер один раз и
      // больше не трогалась — texSubImage2D с кадром большего размера тихо
      // проваливался на уровне WebGL (без JS-исключения, поэтому в лог
      // ничего не попадало): картинка замирала на последнем кадре, а звук
      // с видео шли себе дальше. Перевыделяем текстуру при каждой смене
      // разрешения, а не только один раз при самом первом кадре.
      if (!texAllocated || texW !== video.videoWidth || texH !== video.videoHeight){
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, video.videoWidth, video.videoHeight,
                      0, gl.RGB, gl.UNSIGNED_BYTE, null);
        texAllocated = true;
        texW = video.videoWidth;
        texH = video.videoHeight;
      }
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGB, gl.UNSIGNED_BYTE, video);
      gl.generateMipmap(gl.TEXTURE_2D);   // нужно для режима «блюр» (textureLod)
      texUploads++;
    } catch (e) {
      if (!tainted){ tainted = true;
        log('кадр не читается (' + e.name + '): нужен CORS у видео.'); }
    }
  }

  if (haveVideo){
    document.getElementById('hud').textContent =
      `${video.currentTime.toFixed(1)}с   режим ${mode}   фон ${(lumaGain*100)|0}%   ${fps} к/с`;
  }

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.02,0.02,0.025,1);

  if (xrFrame && xrSession){
    const gls = xrSession.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, gls.framebuffer);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const pose = xrFrame.getViewerPose(xrRefSpace);
    if (pose) for (const v of pose.views){
      const vp = gls.getViewport(v);
      gl.viewport(vp.x, vp.y, vp.width, vp.height);
      drawEye(v.projectionMatrix, v.transform.inverse.matrix);
    }
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const dpr = Math.min(devicePixelRatio||1, 2);
    const w = (innerWidth*dpr)|0, h = (innerHeight*dpr)|0;
    if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
    gl.viewport(0,0,cv.width,cv.height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawEye(perspective(camFov*Math.PI/180, cv.width/cv.height, 0.1, 100), lookRot(yaw, pitch));
  }
}

// ---------------------------------------------------------------- WebXR
// Уроки первого плеера: кэшированные локации юниформов, гарантированные
// триггер/захват независимо от DOM Overlay, защита от requestAnimationFrame
// на закрывающейся сессии.
const vrPanel = document.getElementById('vrPanel');
const showPanel = () => vrPanel.classList.contains('show');
const openPanel = () => vrPanel.classList.add('show');
const closePanel = () => vrPanel.classList.remove('show');
document.getElementById('vrPlay').onclick = () => { if (video.paused) startPlay(); else video.pause(); };
document.getElementById('vrExit').onclick = () => { if (xrSession) xrSession.end(); };

let xrSession = null, xrRefSpace = null;
const xrBtn = document.getElementById('xr');
if (navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    xrBtn.disabled = !ok;
    log(ok ? 'WebXR: immersive-vr доступен' : 'immersive-vr не поддержан');
  });
} else log('WebXR недоступен — обычный режим (мышь)');

xrBtn.onclick = async () => {
  if (xrSession) { await xrSession.end(); return; }
  xrSession = await navigator.xr.requestSession('immersive-vr', {
    optionalFeatures: ['local-floor', 'dom-overlay'],
    domOverlay: {root: vrPanel},
  });
  await gl.makeXRCompatible();
  xrSession.updateRenderState({baseLayer: new XRWebGLLayer(xrSession, gl)});
  xrRefSpace = await xrSession.requestReferenceSpace('local');
  xrBtn.textContent = 'Выйти из VR';
  const overlayOK = !!xrSession.domOverlayState;
  log(overlayOK ? `DOM Overlay: ${xrSession.domOverlayState.type}` : 'DOM Overlay не поддержан');

  xrSession.addEventListener('select', () => {
    if (!haveVideo) return;
    if (video.paused) startPlay(); else video.pause();
  });
  xrSession.addEventListener('squeezestart', () => { xrSession.end(); });
  if (overlayOK){
    video.addEventListener('pause', () => { if (xrSession) openPanel(); });
    video.addEventListener('play', closePanel);
  }
  const thisSession = xrSession;
  xrSession.addEventListener('end', () => {
    xrSession = null; xrBtn.textContent = 'Войти в VR';
    closePanel();
    requestAnimationFrame(loop);
  });
  const xrLoop = (t, f) => {
    frame(t, f);
    if (xrSession !== thisSession) return;
    try { xrSession.requestAnimationFrame(xrLoop); }
    catch (e) { log('XR raf: ' + e.message); }
  };
  xrSession.requestAnimationFrame(xrLoop);
  if (video.paused && haveVideo) video.play();
};

function loop(t){ if (!xrSession){ frame(t, null); requestAnimationFrame(loop); } }
requestAnimationFrame(loop);
</script>
